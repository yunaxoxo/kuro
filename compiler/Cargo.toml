[package]
name = "kuro"
version = "0.1.0"
edition = "2024"
description = "kuro: a small statically typed Math & Algorithms language compiled straight to WebAssembly bytecode (no LLVM)."
publish = false

[lib]
# cdylib -> the .wasm module wasm-pack ships to the browser playground.
# rlib   -> a normal Rust library so `cargo test` (tests/*.rs) can link against it.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Serialising tokens / AST / errors to JSON for the playground's "IR / Pipeline" tab.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only pulled in when compiling *the compiler itself* to wasm32 (see src/lib.rs `wasm_api`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
# Executes the .wasm your codegen emits (tests/e2e_tests.rs).
wasmtime = { version = "50", default-features = false, features = ["std", "runtime", "cranelift"] }
# Validates and structurally inspects the binary (tests/codegen_tests.rs).
wasmparser = "0.263"

[profile.release]
opt-level = "s"
lto = true

# wasm-pack would otherwise download binaryen's `wasm-opt` on the first release
# build. Disabled so the project builds fully offline.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
